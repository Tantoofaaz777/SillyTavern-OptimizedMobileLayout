<div class="chat-card-layout-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Optimized Mobile Layout</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <label class="checkbox_label">
                <input id="ccl_enabled" type="checkbox" />
                <span>Enable mobile layout</span>
            </label>

            <hr>

            <div class="ccl-slider-grid">
                <div class="range-block-range-and-counter alignitemscenter flex-container marginBot5 flexFlowColumn flexBasis48p flexGrow flexShrink gap0">
                    <small class="range-block-title">Text Size</small>
                    <input class="neo-range-slider" type="range" id="ccl_font_size" min="12" max="28" step="1">
                    <div class="wide100p">
                        <input class="neo-range-input" type="number" min="12" max="28" step="1" data-for="ccl_font_size" id="ccl_font_size_counter">
                    </div>
                </div>

                <div class="range-block-range-and-counter alignitemscenter flex-container marginBot5 flexFlowColumn flexBasis48p flexGrow flexShrink gap0">
                    <small class="range-block-title">Name Size</small>
                    <input class="neo-range-slider" type="range" id="ccl_name_size" min="14" max="36" step="1">
                    <div class="wide100p">
                        <input class="neo-range-input" type="number" min="14" max="36" step="1" data-for="ccl_name_size" id="ccl_name_size_counter">
                    </div>
                </div>

                <div class="range-block-range-and-counter alignitemscenter flex-container marginBot5 flexFlowColumn flexBasis48p flexGrow flexShrink gap0">
                    <small class="range-block-title">Avatar Size</small>
                    <input class="neo-range-slider" type="range" id="ccl_avatar_size" min="28" max="96" step="2">
                    <div class="wide100p">
                        <input class="neo-range-input" type="number" min="28" max="96" step="2" data-for="ccl_avatar_size" id="ccl_avatar_size_counter">
                    </div>
                </div>

                <div class="range-block-range-and-counter alignitemscenter flex-container marginBot5 flexFlowColumn flexBasis48p flexGrow flexShrink gap0">
                    <small class="range-block-title">Line Spacing</small>
                    <input class="neo-range-slider" type="range" id="ccl_line_height" min="1" max="2.2" step="0.1">
                    <div class="wide100p">
                        <input class="neo-range-input" type="number" min="1" max="2.2" step="0.1" data-for="ccl_line_height" id="ccl_line_height_counter">
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
